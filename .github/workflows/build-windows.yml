name: Build Windows

on:
  # Windows hosted runners are intentionally opt-in because the full E2E,
  # installer build, and packaged smoke suite are comparatively expensive.
  # Build and validate on a real Windows PC by default. Dispatch this workflow
  # only when GitHub Actions is explicitly requested, or a Windows PC build is
  # unavailable and separate approval is given. Record the exception in reason.
  workflow_dispatch:
    inputs:
      reason:
        description: Why is this Windows build needed?
        required: true
        type: string
      # verification = build exactly the dispatched commit (any ref) as an
      #   unpublished test artifact; pushes to main during the run cannot fail it.
      # release = official package; the checkout must equal the live remote
      #   default HEAD (releaseSourceGuard), so dispatch it on main with no pushes.
      purpose:
        description: verification (test the dispatched commit) or release (official, must equal live main)
        required: true
        type: choice
        options:
          - verification
          - release
        default: verification

jobs:
  build:
    name: Build (${{ inputs.purpose }}) requested by ${{ github.actor }} — ${{ inputs.reason }}
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\cargo-targets\portmanager

    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is counted from git history (buildVersion.ts); a shallow
          # checkout cannot count and the build refuses rather than guess.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the Mac verification baseline runs on, so a
          # Windows failure is never a silent Bun upgrade. Bump deliberately.
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install icon build dependency
        run: python -m pip install Pillow

      - name: Install Playwright Chromium
        run: bun node_modules/playwright/cli.js install chromium

      - name: Run Windows browser E2E
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-windows-e2e.ps1

      # The per-test report and failure screenshots are the only way to triage a
      # failed E2E without re-running the (paid) Windows runner.
      - name: Upload Windows E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-report
          path: |
            tests/results/
            output/playwright/
          if-no-files-found: warn
          retention-days: 7

      # 전용 래퍼가 sidecar + frontend를 먼저 만들고 CARGO_TARGET_DIR을
      # System32 밖의 명시된 안전 경로로 옮긴 뒤 NSIS를 빌드한다. 여기서 tauri를
      # 직접 호출하면 clean runner에는 sidecar가 없고 업로드 경로도 어긋난다.
      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:BUILD_PURPOSE -eq 'release') {
            bun run tauri:build:win
          } else {
            bun build-win.ts "--verification-sha=$env:DISPATCHED_SHA"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          BUILD_PURPOSE: ${{ inputs.purpose }}
          DISPATCHED_SHA: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # GitHub-hosted Windows runners have no interactive desktop, so Edge WebView2
      # cannot create a tauri-driver session there. This still validates the actual
      # installer, committed version, bundled runtime resources, sidecar contract,
      # and uninstaller. Run without -HostedRunnerSmoke on an interactive Windows
      # desktop for the native IPC execute/restart/stop lifecycle E2E.
      - name: Run installed Windows package smoke
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-windows-packaged-e2e.ps1 -HostedRunnerSmoke

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: portmanager-windows-${{ inputs.purpose }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
          retention-days: 7
