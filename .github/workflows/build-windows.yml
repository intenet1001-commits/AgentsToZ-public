name: Build Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\cargo-targets\portmanager

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install icon build dependency
        run: python -m pip install Pillow

      - name: Install Playwright Chromium
        run: bun node_modules/playwright/cli.js install chromium

      - name: Run Windows browser E2E
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-windows-e2e.ps1

      # 전용 래퍼가 sidecar + frontend를 먼저 만들고 CARGO_TARGET_DIR을
      # System32 밖의 명시된 안전 경로로 옮긴 뒤 NSIS를 빌드한다. 여기서 tauri를
      # 직접 호출하면 clean runner에는 sidecar가 없고 업로드 경로도 어긋난다.
      - name: Build Windows installer
        run: bun run tauri:build:win
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # GitHub-hosted Windows runners have no interactive desktop, so Edge WebView2
      # cannot create a tauri-driver session there. This still validates the actual
      # installer, committed version, bundled runtime resources, sidecar contract,
      # and uninstaller. Run without -HostedRunnerSmoke on an interactive Windows
      # desktop for the native IPC execute/restart/stop lifecycle E2E.
      - name: Run installed Windows package smoke
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-windows-packaged-e2e.ps1 -HostedRunnerSmoke

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: portmanager-windows
          path: ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
          retention-days: 7
