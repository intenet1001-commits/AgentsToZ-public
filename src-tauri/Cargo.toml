[package]
name = "app"
version = "625.0.0"
description = "포트 관리기 — 로컬 개발 서버 포트 & 워크트리 관리 도구"
authors = ["CS & Company"]
license = "Proprietary"
repository = "https://github.com/cs-company/portmanager"
homepage = "https://portmanager.cscompany.dev"
edition = "2021"
# The Windows containment launcher is its own package (windows-contain/), not a bin of this crate: Tauri
# copies every bin target of the app package into the bundle, so as one it landed in the macOS app and broke
# `codesign --verify --deep --strict`. `default-run` stays so a future second bin cannot break `tauri dev`.
default-run = "app"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
cc = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
regex = "1.12"
libc = "0.2"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
tauri-plugin-global-shortcut = "2"

# Agent Runtime containment on Windows needs Job Objects, and the provider has to
# be inside one from the moment it is created -- see docs/agent-runtime-containment.md.
# The version is one already in the tree through Tauri, so it adds no new download.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
