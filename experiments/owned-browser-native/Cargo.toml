[package]
name = "agentstoz-browser-spike"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "agentstoz-browser-spike"

[package.metadata.cef.bundle]
helper_name = "agentstoz-browser-helper"

[dependencies]
cef = { version = "=156.0.0", default-features = false, features = ["sandbox", "build-util"] }
tauri = { version = "=2.10.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
cc = "1"
sha2 = "0.10"

[[bin]]
name = "agentstoz-browser-helper"
path = "src/helper.rs"
